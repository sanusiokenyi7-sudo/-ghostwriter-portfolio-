<style>
:root{
  --ink:#172033;
  --muted:#667085;
  --paper:#fff;
  --soft:#f7f8fc;
  --line:#e7eaf1;
  --blue:#13263a;
  --green:#22a06b;
  --dark:#0d1b2a;
  --shadow:0 18px 55px rgba(28,34,56,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:#f6f7f9;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.6;
}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,92%);margin:auto}
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(231,234,241,.85);
}
.nav-inner{height:72px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:-.6px;font-size:20px}
.logo span{color:#927438}
.nav-links{display:flex;gap:22px;align-items:center;font-size:14px;font-weight:700;color:#596276}
.nav-links a:hover{color:#927438}
.nav-cta{
  padding:10px 16px;border-radius:999px;color:#fff;
  background:var(--dark);box-shadow:0 8px 22px rgba(21,24,39,.16)
}
.hero{
  padding:86px 0 70px;
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 85% 15%,rgba(233,79,159,.18),transparent 28%),
    radial-gradient(circle at 15% 5%,rgba(40,120,255,.16),transparent 30%),
    linear-gradient(180deg,#fff 0%,#faf9ff 100%);
}
.hero-grid{display:grid;grid-template-columns:1.18fr .82fr;gap:55px;align-items:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 12px;border-radius:999px;
  background:#f5ecd9;color:#735b28;font-size:12px;font-weight:900;
  text-transform:uppercase;letter-spacing:.7px
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
h1{font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-3.5px;margin:18px 0}
.gradient-text{
  background:linear-gradient(90deg,#c9a45c,#8f6d2d);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.hero-copy{font-size:18px;color:var(--muted);max-width:680px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:13px 19px;border-radius:13px;font-weight:850;font-size:14px
}
.btn-main{background:#0d1b2a;color:#fff;box-shadow:0 12px 28px rgba(109,69,255,.25)}
.btn-light{background:#fff;border:1px solid var(--line)}
.hero-card{
  background:var(--dark);color:#fff;border-radius:30px;padding:30px;
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.hero-card:before,.hero-card:after{
  content:"";position:absolute;border-radius:50%;filter:blur(2px)
}
.hero-card:before{width:180px;height:180px;background:rgba(109,69,255,.55);right:-80px;top:-70px}
.hero-card:after{width:140px;height:140px;background:rgba(233,79,159,.35);left:-80px;bottom:-80px}
.hero-card>*{position:relative;z-index:1}
.hero-card h3{font-size:25px;margin:0 0 8px}
.hero-card p{color:#c9cede;margin:0 0 22px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);border-radius:999px;font-size:12px;color:#eef0f7}
section{padding:82px 0}
.section-head{max-width:720px;margin-bottom:34px}
.kicker{font-size:12px;font-weight:900;color:#927438;letter-spacing:1px;text-transform:uppercase}
h2{font-size:clamp(30px,4vw,45px);line-height:1.08;letter-spacing:-1.7px;margin:8px 0 12px}
.section-head p{color:var(--muted);margin:0}
.services{background:#fff}
.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.service{
  background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;
  box-shadow:0 8px 28px rgba(28,34,56,.045);transition:.2s
}
.service:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.icon{
  width:45px;height:45px;border-radius:14px;display:grid;place-items:center;
  font-size:21px;margin-bottom:16px
}
.i1{background:#eee9ff}.i2{background:#e8f1ff}.i3{background:#ffeaf5}
.i4{background:#fff0df}.i5{background:#e6f8ef}.i6{background:#eaf8ff}
.service h3{margin:0 0 7px;font-size:18px}.service p{margin:0;color:var(--muted);font-size:14px}
.work{background:linear-gradient(180deg,#f7f8fc,#fff)}
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.work-card{
  min-height:285px;border-radius:25px;padding:26px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow)
}
.work-card:nth-child(1){background:linear-gradient(135deg,#5e35e8,#a65cf4)}
.work-card:nth-child(2){background:linear-gradient(135deg,#1d67dc,#40a8ff)}
.work-card:nth-child(3){background:linear-gradient(135deg,#d93f88,#f37b6c)}
.work-card:nth-child(4){background:linear-gradient(135deg,#1d7658,#47b77e)}
.work-card small{opacity:.78;text-transform:uppercase;letter-spacing:.8px;font-weight:900}
.work-card h3{font-size:26px;line-height:1.1;margin:12px 0 9px}
.work-card p{color:rgba(255,255,255,.86);max-width:470px}
.work-card .tagrow{position:absolute;bottom:24px;left:26px;right:26px;display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:11px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
.approach{background:#fff}
.approach-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:45px;align-items:start}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}
.num{width:38px;height:38px;border-radius:12px;background:#f0edff;color:#927438;display:grid;place-items:center;font-weight:900}
.step h3{margin:0 0 3px;font-size:16px}.step p{margin:0;color:var(--muted);font-size:14px}
.audience{background:#151827;color:#fff}
.audience-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.audience-card{padding:28px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.05);border-radius:22px}
.audience-card h3{font-size:22px;margin:0 0 8px}.audience-card p{color:#c8ccda}
.audience-card ul{margin:18px 0 0;padding-left:18px;color:#e5e7ef}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
.about-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}
.about-card p{color:var(--muted)}
.highlight{
  background:linear-gradient(135deg,#f0edff,#fff1f7);
  border:0
}
.highlight strong{font-size:31px;display:block;letter-spacing:-1px}
.contact{
  padding:80px 0 95px;
  background:linear-gradient(135deg,#6d45ff,#9b54e9 45%,#e94f9f);
  color:#fff;text-align:center
}
.contact h2{max-width:720px;margin:10px auto 14px}
.contact p{color:rgba(255,255,255,.86);max-width:650px;margin:0 auto}
.contact-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}
.contact .btn-light{border:0}
footer{background:#10121d;color:#aeb4c3;padding:25px 0;font-size:13px}
.footer-inner{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
@media(max-width:850px){
  .hero-grid,.approach-grid,.about-grid{grid-template-columns:1fr}
  .service-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .nav-inner{height:auto;min-height:68px;gap:10px;align-items:center}
  .nav-links{gap:12px;overflow-x:auto;max-width:70vw;padding:8px 0;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{font-size:12px;white-space:nowrap}
  .nav-cta{padding:8px 12px}
  .hero{padding:60px 0 50px}
  h1{letter-spacing:-2px}
  .service-grid,.work-grid,.audience-grid{grid-template-columns:1fr}
  section{padding:65px 0}
}

/* Premium portfolio refinements */
.nav-cta{background:#0d1b2a!important}
.nav-cta:hover{background:#c9a45c!important;color:#0d1b2a!important}
.hero{background:linear-gradient(180deg,#fff 0%,#f8f6f0 100%)}
.hero-card{background:#0d1b2a}
.service:hover{border-color:#d9c79e}
.work-card{background:#0d1b2a!important}
.work-card:nth-child(2){background:#172f46!important}.work-card:nth-child(3){background:#21384d!important}.work-card:nth-child(4){background:#263d4d!important}
.contact{background:#0d1b2a}
@media(max-width:650px){h1{letter-spacing:-2.3px}.hero{padding:62px 0 55px}}
</style>

<style id="final-conversion-polish">
  /* FINAL CONVERSION + ACCESSIBILITY POLISH */
  html { scroll-behavior: smooth; }
  :focus-visible { outline: 2px solid #d6b36a; outline-offset: 4px; border-radius: 6px; }

    transition:top .2s ease;
  }

    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0;

  }

    background:rgba(255,255,255,.025);
  }
  .hire-card h3 { margin:0 0 .45rem; }
  .hire-card p { margin:0; color:rgba(255,255,255,.65); line-height:1.65; }
  .hire-arrow { color:#d6b36a; font-size:1.2rem; white-space:nowrap; }
  .sample-actions { display:flex; flex-wrap:wrap; gap:.65rem; margin-top:1rem; }
  .sample-link {
    display:inline-flex; align-items:center; justify-content:center; min-height:42px;
    padding:.65rem .9rem; border:1px solid rgba(214,179,106,.32);
    border-radius:10px; color:#f4e6c4; text-decoration:none; font-weight:700;
    font-size:.8rem; transition:transform .2s ease, background .2s ease, border-color .2s ease;
  }
  .sample-link:hover { transform:translateY(-2px); background:rgba(214,179,106,.08); border-color:#d6b36a; }
  .work-card .sample-actions { position:absolute; left:26px; bottom:62px; }
  .work-card .sample-link { background:rgba(7,17,31,.32); }
  .micro-note { margin-top:.8rem; color:rgba(255,255,255,.48); font-size:.76rem; line-height:1.55; }
  .final-cta {
    text-align:center; padding:3rem 1.5rem; border:1px solid rgba(214,179,106,.25);
    border-radius:26px; background:radial-gradient(circle at 50% 0, rgba(214,179,106,.10), transparent 60%), rgba(255,255,255,.025);
  }
  .final-cta p { max-width:680px; margin:.8rem auto 1.4rem; color:rgba(255,255,255,.66); line-height:1.7; }
  @media (max-width: 800px) {
    .proof-strip, .hire-grid { grid-template-columns:1fr; }
    .proof-item { border-right:0; border-bottom:1px solid rgba(255,255,255,.08); }
    .proof-item:last-child { border-bottom:0; }
    .hire-card { flex-direction:column; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
</style>
